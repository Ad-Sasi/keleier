# Le robot : toutes les deux heures, relit les flux et met à jour data/journal.json
name: robot
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ramasser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python robot/fetch.py
      - name: Enregistrer si quelque chose a changé
        run: |
          git config user.name "robot-keleier"
          git config user.email "robot-keleier@users.noreply.github.com"
          git add data/journal.json
          git diff --cached --quiet || (git commit -m "Keleier : nouveautés" && git push)
